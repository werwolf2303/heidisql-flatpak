name: Build HeidiSQL Flatpaks

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to build (default is the latest HeidiSQL release)
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Look for a new upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag=$(gh api repos/HeidiSQL/HeidiSQL/releases/latest --jq .tag_name)
          fi
          echo "Upstream tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # A manual run with an explicit tag always rebuilds; the release
          # step replaces an existing release for that tag.
          if [ -z "$REQUESTED_TAG" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already released, nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    name: ${{ matrix.toolkit }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolkit: gtk2, arch: x86_64,  runner: ubuntu-24.04 }
          - { toolkit: qt5,  arch: x86_64,  runner: ubuntu-24.04 }
          - { toolkit: qt6,  arch: x86_64,  runner: ubuntu-24.04 }
          - { toolkit: qt6,  arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Render manifest
        id: render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          app_id=$(python3 -I scripts/render.py \
            --tag "${{ needs.check.outputs.tag }}" \
            --toolkit "${{ matrix.toolkit }}" \
            --arch "${{ matrix.arch }}" \
            --out "$RUNNER_TEMP/flatpak")
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ runner.temp }}/flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --disable-rofiles-fuse --repo=repo build "${{ steps.render.outputs.app_id }}.json"

      - name: Create bundle
        working-directory: ${{ runner.temp }}/flatpak
        run: |
          flatpak build-bundle repo \
            "HeidiSQL-${{ matrix.toolkit }}-${{ needs.check.outputs.tag }}-${{ matrix.arch }}.flatpak" \
            "${{ steps.render.outputs.app_id }}" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.toolkit }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/flatpak/*.flatpak
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flatpak-*
          path: bundles
          merge-multiple: true

      - name: Publish release with upstream title and notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh api "repos/HeidiSQL/HeidiSQL/releases/tags/$TAG" > upstream.json
          jq -r '.name // .tag_name' upstream.json > title.txt
          jq -r '.body // ""' upstream.json > notes.md

          # Only reachable for an explicit rebuild; replace the old release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$TAG" bundles/*.flatpak \
            --repo "$GITHUB_REPOSITORY" \
            --title "$(cat title.txt)" \
            --notes-file notes.md

  publish-repo:
    needs: [check, release]
    runs-on: ubuntu-24.04
    concurrency:
      group: flatpak-repo-publish
      cancel-in-progress: false
    steps:
      - name: Install flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak ostree gnupg

      - uses: actions/download-artifact@v4
        with:
          pattern: flatpak-*
          path: bundles
          merge-multiple: true

      - name: Check out the repository site
        uses: actions/checkout@v4
        with:
          repository: werwolf2303/werwolf2303.github.io
          ref: master
          token: ${{ secrets.PAGES_REPO_TOKEN }}
          path: site

      - name: Import bundles and sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          repo=site/flatpak/repo
          [ -d "$repo" ] || ostree init --mode=archive-z2 --repo="$repo"
          for bundle in bundles/*.flatpak; do
            flatpak build-import-bundle --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" "$repo" "$bundle"
          done
          # Keep only the newest commit of each ref so the repository stays small.
          flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" \
            --prune --prune-depth=1 "$repo"

      - name: Push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flatpak/repo
          git commit -m "HeidiSQL ${{ needs.check.outputs.tag }}"
          git push
