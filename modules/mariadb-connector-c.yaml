name: mariadb-connector-c
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -DWITH_SSL=OPENSSL
  - -DWITH_UNIT_TESTS=OFF
  - -DINSTALL_LIBDIR=lib
  - -DINSTALL_PLUGINDIR=lib/mariadb/plugin
cleanup:
  - /include
  - /bin
  - /lib/pkgconfig
