name: libpq
buildsystem: simple
build-commands:
  - ./configure --prefix=/app --with-openssl --without-readline --without-icu --without-zlib
  - make -j$FLATPAK_BUILDER_N_JOBS -C src/interfaces/libpq
  - make -C src/interfaces/libpq install
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
sources:
  - type: archive
    url: https://ftp.postgresql.org/pub/source/v17.6/postgresql-17.6.tar.bz2
    sha256: e0630a3600aea27511715563259ec2111cd5f4353a4b040e0be827f94cd7a8b0
