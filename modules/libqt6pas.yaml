name: libqt6pas
buildsystem: simple
subdir: cbindings
build-commands:
  - qmake6 Qt6Pas.pro
  - make -j$FLATPAK_BUILDER_N_JOBS
  - install -d /app/lib
  - cp -a libQt6Pas.so* /app/lib/
